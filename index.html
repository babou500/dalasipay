/* =========================================================
   v0.17 — premium interface refresh
   Visual-only layer. Payroll logic and controls are unchanged.
   ========================================================= */
:root{
  --background:#f5f7f6;
  --foreground:#10221d;
  --card:#ffffff;
  --card-foreground:#10221d;
  --panel:#ffffff;
  --panel-2:#f7f9f8;
  --muted:#66756f;
  --muted-foreground:#66756f;
  --border:#e2e8e5;
  --primary:#0b6b57;
  --primary-foreground:#ffffff;
  --secondary:#e9f5f0;
  --secondary-foreground:#0b6b57;
  --accent:#0b6b57;
  --success:#e7f6ef;
  --success-foreground:#17644f;
  --warning:#fff4df;
  --warning-foreground:#915b12;
  --danger:#b33b35;
  --soft:#e9f5f0;
  --soft-2:#f3f7f5;
  --good:#176b55;
  --warn:#9a6113;
  --warn-bg:#fff5e5;
  --text:#10221d;
  --bg:#f5f7f6;
  --shadow:0 1px 2px rgba(16,34,29,.03),0 12px 34px rgba(16,34,29,.055);
  --shadow-lg:0 22px 70px rgba(9,39,31,.13);
  --shadow-sm:0 4px 16px rgba(9,39,31,.05);
  --radius:18px;
  --radius-sm:12px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --background:#0d1513;
  --foreground:#edf4f1;
  --card:#131f1c;
  --card-foreground:#edf4f1;
  --panel:#131f1c;
  --panel-2:#182622;
  --muted:#9caea7;
  --muted-foreground:#9caea7;
  --border:#263630;
  --primary:#65cdb0;
  --primary-foreground:#092b23;
  --secondary:#1a352d;
  --secondary-foreground:#9fe7d3;
  --accent:#65cdb0;
  --success:#1d342d;
  --success-foreground:#8cddc4;
  --warning:#342a19;
  --warning-foreground:#e9b968;
  --danger:#ef8b84;
  --soft:#1b302a;
  --soft-2:#192722;
  --good:#82d9bd;
  --warn:#e1ad61;
  --warn-bg:#342b1e;
  --text:#edf4f1;
  --bg:#0d1513;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 14px 42px rgba(0,0,0,.17);
  --shadow-lg:0 28px 80px rgba(0,0,0,.32);
  color-scheme:dark;
}

html{background:var(--background);scroll-behavior:smooth}
body{background:var(--background);color:var(--foreground);font-size:14px;letter-spacing:-.005em;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}
button{transition:background .16s ease,border-color .16s ease,color .16s ease,transform .16s ease,box-shadow .16s ease}
button:not(:disabled):active{transform:translateY(1px)}
::selection{background:rgba(11,107,87,.18)}

/* App shell */
.sidebar{
  width:262px;
  padding:24px 18px 20px;
  background:linear-gradient(180deg,#092f27 0%,#0b392f 48%,#082b24 100%);
  border-right:0;
  box-shadow:12px 0 35px rgba(7,43,35,.06);
  color:#eef8f4;
}
.sidebar .brand{padding:2px 9px 4px;gap:12px}
.sidebar .brand-icon{
  width:38px;height:38px;border-radius:12px;
  background:linear-gradient(145deg,#4ad0a8,#1d8c70);
  color:#062b22;box-shadow:0 8px 22px rgba(32,185,145,.2)
}
.sidebar .brand b{font-size:20px;color:#fff;letter-spacing:-.7px}
.sidebar .brand b span{color:#8ce6ca}
.sidebar .brand small{font-size:9.5px;color:rgba(229,250,243,.5);letter-spacing:1.7px;margin-top:3px}
.sidebar .nav-label{font-size:10.5px;letter-spacing:1.55px;color:rgba(226,246,239,.42);margin:3px 10px 8px}
.sidebar nav{gap:5px}
.sidebar nav button{
  min-height:43px;padding:0 12px;border-radius:11px;
  color:rgba(235,248,243,.66);font-size:13px;font-weight:650;
}
.sidebar nav button svg{opacity:.8}
.sidebar nav button:hover{background:rgba(255,255,255,.065);color:#fff}
.sidebar nav button.active{
  background:linear-gradient(90deg,rgba(130,225,195,.16),rgba(255,255,255,.055));
  color:#fff;font-weight:800;box-shadow:inset 3px 0 0 #72d5b7
}
.sidebar nav button.active svg{opacity:1;color:#89e0c5}
.sidebar nav button i{width:7px;height:7px;background:#f1bd67;box-shadow:0 0 0 3px rgba(241,189,103,.12)}
.workspace{
  margin:25px 0 22px;padding:10px 11px;border-radius:13px;
  border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.055);
  color:#fff
}
.workspace:hover{background:rgba(255,255,255,.085);border-color:rgba(255,255,255,.16)}
.workspace-avatar{width:34px;height:34px;border-radius:10px;background:#dff7ee;color:#0a5e4c;font-size:13px}
.workspace b{font-size:13px;color:#fff}
.workspace small{font-size:10.5px;color:rgba(230,247,241,.56);text-transform:capitalize}
.workspace>span:last-child{color:rgba(255,255,255,.55)}
.side-callout{
  border:1px solid rgba(255,255,255,.095);border-radius:14px;padding:15px;
  background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.035));
  box-shadow:none
}
.side-callout>span{width:31px;height:31px;border-radius:9px;background:rgba(117,222,190,.14);color:#8ce4ca}
.side-callout b{font-size:12.5px;color:#fff}
.side-callout p{font-size:11px;line-height:1.55;color:rgba(234,248,243,.58)}
.side-callout button{color:#91e4cc;font-size:11.5px}
.profile{border-top:1px solid rgba(255,255,255,.09);padding-top:16px;margin-top:17px}
.profile>span{background:#dff7ee;color:#0b5e4c;width:34px;height:34px}
.profile b{font-size:12px;color:#fff}.profile small{font-size:10.5px;color:rgba(234,248,243,.5)}.profile svg{color:rgba(255,255,255,.45)}

.main{margin-left:262px;background:var(--background)}
.topbar{
  height:74px;padding:0 38px;border-bottom:1px solid var(--border);
  background:color-mix(in srgb,var(--card) 91%,transparent);backdrop-filter:blur(16px) saturate(150%)
}
.crumb{font-size:12.5px;gap:10px;color:var(--muted-foreground)}
.crumb b{opacity:.45}.crumb strong{font-size:13px;color:var(--foreground)}
.search-btn{
  width:330px;height:40px;border-radius:11px;background:var(--panel-2);border:1px solid var(--border);
  color:var(--muted-foreground);font-size:12px;padding:0 12px
}
.search-btn:hover{border-color:color-mix(in srgb,var(--primary) 30%,var(--border));background:var(--card)}
.search-btn kbd{font-size:10.5px;border-radius:6px;padding:3px 6px;background:var(--card);box-shadow:0 1px 1px rgba(0,0,0,.03)}
.icon-btn{width:40px;height:40px;border-radius:11px;background:var(--card);border:1px solid var(--border);box-shadow:0 1px 2px rgba(16,34,29,.02)}
.icon-btn:hover{background:var(--panel-2);border-color:color-mix(in srgb,var(--primary) 25%,var(--border))}
.top-avatar{width:36px;height:36px;background:linear-gradient(145deg,#0a4d40,#14745e);font-size:11.5px;box-shadow:0 5px 14px rgba(7,71,56,.16)}
.content{padding:38px 40px 96px;max-width:1510px}

/* Typography and actions */
.eyebrow{font-size:10.5px;font-weight:850;letter-spacing:1.55px;color:var(--primary)}
.page-title{align-items:flex-start;margin-bottom:25px}
.page-title h1{font-size:32px;line-height:1.12;letter-spacing:-1.2px;margin:8px 0 7px;font-weight:760}
.page-title p{font-size:13px;line-height:1.62;color:var(--muted-foreground);max-width:700px}
.page-actions{gap:9px;flex-wrap:wrap;justify-content:flex-end}
.primary,.secondary{
  min-height:40px;border-radius:10px;padding:0 15px;font-size:12.5px;font-weight:760;letter-spacing:-.01em
}
.primary{background:linear-gradient(180deg,#0f775f,#0a634f);border-color:#0a634f;color:#fff;box-shadow:0 5px 15px rgba(11,107,87,.12)}
.primary:hover:not(:disabled){background:linear-gradient(180deg,#0c6f59,#075844);box-shadow:0 7px 18px rgba(11,107,87,.18)}
.secondary{background:var(--card);border:1px solid var(--border);color:var(--foreground);box-shadow:0 1px 2px rgba(16,34,29,.02)}
.secondary:hover:not(:disabled){background:var(--panel-2);border-color:color-mix(in srgb,var(--primary) 24%,var(--border))}
.text-btn{font-size:12px;color:var(--primary);font-weight:750}

/* Surfaces */
.surface{
  background:var(--card);border:1px solid var(--border);border-radius:17px;
  box-shadow:var(--shadow)
}
.card-head h3{font-size:14px;letter-spacing:-.25px}.card-head p{font-size:11.5px;line-height:1.45;color:var(--muted-foreground)}
.pill{min-height:25px;padding:0 9px;border-radius:999px;font-size:10px;letter-spacing:.25px;font-weight:800}
.pill.ready{background:#e8f7f1;border-color:#cbeadd;color:#176a54}
.pill.approved{background:#eef2fb;border-color:#dce4f5;color:#4c6293}
.pill.paid,.pill.closed{background:#e9f3fb;border-color:#d1e4f2;color:#316e95}

/* Executive dashboard */
.hero-payroll.executive-hero{
  position:relative;overflow:hidden;padding:29px 30px;min-height:148px;
  grid-template-columns:minmax(0,1.25fr) minmax(220px,.7fr) auto;
  border:0;background:
    radial-gradient(circle at 88% 16%,rgba(120,227,194,.19),transparent 28%),
    linear-gradient(135deg,#092f27 0%,#0b4438 56%,#0d5a48 100%);
  color:#fff;box-shadow:0 18px 44px rgba(8,58,47,.14)

.hero-payroll.executive-hero:after{content:"";position:absolute;width:280px;height:280px;border-radius:50%;right:-90px;bottom:-165px;border:1px solid rgba(255,255,255,.09);box-shadow:0 0 0 45px rgba(255,255,255,.025),0 0 0 90px rgba(255,255,255,.018);pointer-events:none}
.hero-payroll .eyebrow{color:#91e1ca}.hero-payroll .hero-line h2{font-size:25px;line-height:1.1;letter-spacing:-.7px;margin:8px 0 7px}.hero-payroll p{font-size:13px;color:rgba(235,249,244,.66)}

(() => {

  ];

  };
  const round2=n=>Math.round((Number(n||0)+Number.EPSILON)*100)/100;
  const periodIndex=period=>{const [y,m]=String(period||'2026-10').split('-').map(Number);return (y||0)*12+(m||1)-1;};
  const activeForPeriod=(item,period)=>item&&item.active!==false&&periodIndex(item.startPeriod||period)<=periodIndex(period)&&(!item.endPeriod||periodIndex(item.endPeriod)>=periodIndex(period));
  function recurringSummary(employee,period){
    const items=(employee.recurringItems||[]).filter(x=>activeForPeriod(x,period));
    const out={earnings:0,deductions:0,benefits:0,items};
    items.forEach(i=>{const n=Number(i.amount)||0;if(i.kind==='earning')out.earnings+=n;else if(i.kind==='deduction')out.deductions+=n;else if(i.kind==='benefit')out.benefits+=n;});
    out.earnings=round2(out.earnings);out.deductions=round2(out.deductions);out.benefits=round2(out.benefits);return out;
  }
  function dueDate(period,day=15){const [y,m]=String(period).split('-').map(Number);return new Date(Date.UTC(y,m,Math.max(1,Number(day)||15)));}
  function paydayDate(period,config=DEFAULT_CONFIG){const [y,m]=String(period).split('-').map(Number),d=Math.min(Math.max(1,Number(config.paydayDay)||28),new Date(Date.UTC(y,m,0)).getUTCDate());return new Date(Date.UTC(y,m-1,d));}
  function iso(d){return d.toISOString().slice(0,10);}
  function calendar(period,config=DEFAULT_CONFIG){
    const payday=paydayDate(period,config),prep=new Date(payday.getTime()-Math.max(0,Number(config.payrollPrepLeadDays)||0)*86400000),remit=dueDate(period,15);
    const [y,m]=String(period).split('-').map(Number),prefix=`${y}-${String(m).padStart(2,'0')}`;
    return {
      payday:iso(payday),prepStart:iso(prep),payeDue:iso(remit),socialDue:iso(remit),
      holidays:VERIFIED_2026_HOLIDAYS.filter(h=>h.date.startsWith(prefix))
    };
  }
  function paymentReference(prefix,period,employeeId){return `${String(prefix||'SAL').toUpperCase()}-${String(period).replace('-','')}-${String(employeeId).replace(/[^A-Za-z0-9]/g,'')}`;}
  function preparePaymentBatch(payroll,period,config=DEFAULT_CONFIG){
    const items=(payroll?.rows||[]).map(r=>({employeeId:r.employee.id,employeeName:r.employee.name,paymentDetails:r.employee.bank||'',amount:round2(r.net),reference:paymentReference(config.paymentReferencePrefix,period,r.employee.id),status:r.employee.bank?'Prepared':'Missing details'}));
    const total=round2(items.reduce((a,x)=>a+x.amount,0));
    return {id:`batch-${period}-${Date.now()}`,period,status:'Prepared',createdAt:new Date().toISOString(),format:config.bankFileFormat||'Generic CSV',items,total};
  }
  function reconcile(batch,payroll){
    const expected=round2(payroll?.totals?.net||0),batchTotal=round2(batch?.total||0),missing=(batch?.items||[]).filter(x=>!x.paymentDetails||x.status==='Missing details');
    return {expected,batchTotal,difference:round2(batchTotal-expected),missingCount:missing.length,missing,matched:Math.abs(batchTotal-expected)<0.01&&missing.length===0};
  }
  function finalSettlement(employee,calc,opts={}){
    const additions=round2((Number(opts.noticePay)||0)+(Number(opts.leavePayout)||0)+(Number(opts.otherEarnings)||0));
    const outstanding=round2((employee.obligations||[]).filter(x=>x.status!=='Closed').reduce((a,x)=>a+(Number(x.outstanding)||0),0));
    const manualDed=round2(Number(opts.otherDeductions)||0);
    const grossPreview=round2((Number(calc?.gross)||0)+additions);
    const deductionsPreview=round2((Number(calc?.totalDeductions)||0)+outstanding+manualDed);
    return {baseGross:round2(calc?.gross||0),baseNet:round2(calc?.net||0),additions,outstandingObligations:outstanding,otherDeductions:manualDed,grossPreview,netPreview:round2(Math.max(0,grossPreview-deductionsPreview)),note:'Preview only. Final statutory treatment of termination, notice, leave payout or other exit payments must be reviewed before production use.'};
  }
  window.DalasiOps={VERIFIED_2026_HOLIDAYS,DEFAULT_CONFIG,round2,periodIndex,activeForPeriod,recurringSummary,dueDate,paydayDate,calendar,preparePaymentBatch,reconcile,finalSettlement,paymentReference};
})();

      {account:a.benefitsExpense,debit:round2(t.employerBenefits),credit:0,memo:`Employer benefits · ${period}`},
      {account:a.payePayable,debit:0,credit:round2(t.paye),memo:`PAYE withheld · ${period}`},
      {account:a.employeeContributionPayable,debit:0,credit:round2(t.employeeContribution),memo:`Employee social contribution · ${period}`},
      {account:a.otherDeductionsPayable,debit:0,credit:round2(t.otherDeductions),memo:`Loans, advances & other deductions · ${period}`},
      {account:a.payrollPayable,debit:0,credit:round2(t.net),memo:`Net payroll payable · ${period}`},
      {account:a.employerContributionPayable,debit:0,credit:round2(t.employerContribution),memo:`Employer social contribution payable · ${period}`},
      {account:a.iicfPayable,debit:0,credit:round2(t.iicf),memo:`IICF payable · ${period}`},
      {account:a.benefitsPayable,debit:0,credit:round2(t.employerBenefits),memo:`Employee benefits payable · ${period}`}
    ].filter(x=>x.debit||x.credit);
    const debit=round2(entries.reduce((s,x)=>s+x.debit,0)),credit=round2(entries.reduce((s,x)=>s+x.credit,0));
    return {period,entries,debit,credit,difference:round2(debit-credit),balanced:Math.abs(debit-credit)<0.01};
  }

  function costCentreSummary(rows,period){
    const map=new Map();
    (rows||[]).forEach(r=>{
      const mov=movementForPeriod(r.employee,period),key=mov.costCentre||mov.department||'Unassigned';
      if(!map.has(key))map.set(key,{costCentre:key,employees:0,gross:0,net:0,employerCost:0});
      const item=map.get(key);item.employees++;item.gross+=Number(r.gross)||0;item.net+=Number(r.net)||0;item.employerCost+=Number(r.employerCost)||0;
    });
    return [...map.values()].map(x=>({...x,gross:round2(x.gross),net:round2(x.net),employerCost:round2(x.employerCost)})).sort((a,b)=>b.employerCost-a.employerCost);
  }
  function projectSummary(rows,period){
    const map=new Map();
    (rows||[]).forEach(r=>{
      const mov=movementForPeriod(r.employee,period),key=mov.project||'Unassigned';
      if(!map.has(key))map.set(key,{project:key,employees:0,employerCost:0});
      const item=map.get(key);item.employees++;item.employerCost+=Number(r.employerCost)||0;
    });
    return [...map.values()].map(x=>({...x,employerCost:round2(x.employerCost)})).sort((a,b)=>b.employerCost-a.employerCost);
  }

  function validateStatutory(payroll,rules,period){
    const rows=payroll?.rows||[],errors=[],warnings=[];
    rows.forEach(r=>{
      const e=r.employee||{};
      if(!String(e.name||'').trim())errors.push({employeeId:e.id||'',type:'PAYE',message:'Employee name missing'});
      if(!String(e.tin||'').trim())errors.push({employeeId:e.id||'',type:'PAYE',message:'TIN missing'});
      const expectedPaye=window.DalasiPayroll?.monthlyPAYE?window.DalasiPayroll.monthlyPAYE(r.taxable,rules?.payeBands):r.paye;
      if(Math.abs((Number(expectedPaye)||0)-(Number(r.paye)||0))>0.02)errors.push({employeeId:e.id||'',type:'PAYE',message:'PAYE does not match current configured bands'});
      if(!String(e.sshfc||'').trim())errors.push({employeeId:e.id||'',type:'SSHFC',message:'Social Security number missing'});
      if(rules?.scheme==='NPF'){
        const expEmp=round2((Number(r.basic)||0)*Number(rules.npfEmployeeRate||0)),expEr=round2((Number(r.basic)||0)*Number(rules.npfEmployerRate||0));
        if(Math.abs(expEmp-(Number(r.employeeContribution)||0))>0.02||Math.abs(expEr-(Number(r.employerContribution)||0))>0.02)errors.push({employeeId:e.id||'',type:'SSHFC',message:'NPF contribution mismatch'});
      }else{
        const exp=round2((Number(r.gross)||0)*Number(rules?.fpsEmployerRate||0));
        if(Math.abs(exp-(Number(r.employerContribution)||0))>0.02)errors.push({employeeId:e.id||'',type:'SSHFC',message:'FPS contribution mismatch'});
      }
      const iicf=Math.min(round2((Number(r.gross)||0)*Number(rules?.iicfRate||0)),Number(rules?.iicfMonthlyCap||0));
      if(Math.abs(iicf-(Number(r.iicf)||0))>0.02)errors.push({employeeId:e.id||'',type:'IICF',message:'IICF contribution mismatch'});
      if((Number(r.net)||0)<0)errors.push({employeeId:e.id||'',type:'Payroll',message:'Negative net pay'});
      if(!String(e.bank||'').trim()||String(e.bank).toLowerCase()==='not added')warnings.push({employeeId:e.id||'',type:'Payment',message:'Payment details missing'});
    });
    return {period,scheme:rules?.scheme||'NPF',errors,warnings,blocking:errors.length,ready:errors.length===0};
  }

  function prePayrollChecklist({payroll,employees=[],rules={},period,attendanceSummary=null,variance=null,approvals=[]}={}){
    const validation=validateStatutory(payroll,rules,period),active=(employees||[]).filter(e=>e.status!=='Exited');
    const missingBank=active.filter(e=>!String(e.bank||'').trim()||String(e.bank).toLowerCase()==='not added').length;
    const attendanceDone=attendanceSummary?Number(attendanceSummary.configured||0)>=active.length:false;
    const items=[
      {id:'statutory',label:'Statutory identifiers & calculations',status:validation.ready?'pass':'fail',detail:validation.ready?'PAYE/SSHFC validation passed':`${validation.errors.length} blocking issue${validation.errors.length===1?'':'s'}`},
      {id:'bank',label:'Employee payment details',status:missingBank?'fail':'pass',detail:missingBank?`${missingBank} employee${missingBank===1?'':'s'} missing payment details`:'Payment details complete'},
      {id:'attendance',label:'Attendance / timesheets',status:attendanceDone?'pass':'warn',detail:attendanceDone?'All active employees updated':'Some employee attendance is not updated'},
      {id:'variance',label:'Month-on-month variance review',status:variance?.hasBaseline?(variance.employeeFlags?.length?'warn':'pass'):'warn',detail:variance?.hasBaseline?(variance.employeeFlags?.length?`${variance.employeeFlags.length} employee variance flag${variance.employeeFlags.length===1?'':'s'}`:'No material employee variance flags'):'No previous archived baseline'},
      {id:'approvals',label:'Approval workflow',status:(approvals||[]).every(x=>x.status==='Approved')?'pass':'warn',detail:(approvals||[]).every(x=>x.status==='Approved')?'HR and Finance approvals complete':'Approvals still pending'}
    ];
    const passed=items.filter(x=>x.status==='pass').length,failed=items.filter(x=>x.status==='fail').length;
    return {items,passed,failed,score:Math.round(passed/items.length*100),ready:failed===0,validation};
  }

  window.DalasiControls={DEFAULT_CONFIG,normalizeConfig,round2,periodIndex,monthsInclusive,movementForPeriod,retroAdjustment,retroForPeriod,createCorrection,correctionSummary,journal,costCentreSummary,projectSummary,validateStatutory,prePayrollChecklist};
})();

<script>
(() => {
  const DEFAULT_RULES = {
    verifiedOn: '2026-10-04',
    sourceNote: 'Defaults based on current GRA and SSHFC public guidance. Verify before production use.',
    scheme: 'NPF',
    payeBands: [
      { upTo: 36000, rate: 0 },
      { upTo: 46000, rate: 0.05 },
      { upTo: 56000, rate: 0.10 },
      { upTo: 66000, rate: 0.15 },
      { upTo: 76000, rate: 0.20 },
      { upTo: null, rate: 0.25 }
    ],
    npfEmployeeRate: 0.05,
    npfEmployerRate: 0.10,
    fpsEmployerRate: 0.15,
    iicfRate: 0.01,
    iicfMonthlyCap: 15,
    payeDueDay: 15,
    socialDueDay: 15,
    payrollDaysPerMonth: 30,
    overtimeMultiplier: 1.5
  };

  const round2 = n => Math.round((Number(n) + Number.EPSILON) * 100) / 100;

  function annualPAYE(annualTaxable, bands = DEFAULT_RULES.payeBands) {
    let income = Math.max(0, Number(annualTaxable) || 0);
    let tax = 0;
    let lower = 0;
    for (const band of bands) {
      const upper = band.upTo == null ? Infinity : Number(band.upTo);
      if (income <= lower) break;
      const taxableInBand = Math.min(income, upper) - lower;
      tax += Math.max(0, taxableInBand) * Number(band.rate || 0);
      if (!Number.isFinite(upper)) break;
      lower = upper;
    }
    return round2(tax);
  }

  function monthlyPAYE(monthlyTaxable, bands = DEFAULT_RULES.payeBands) {
    return round2(annualPAYE((Number(monthlyTaxable)||0) * 12, bands) / 12);
  }

  function periodIndex(period) {
    const [y,m] = String(period || '2026-10').split('-').map(Number);
    return (Number(y)||0) * 12 + (Number(m)||1) - 1;
  }

  function compensationForPeriod(employee, period) {
    const history = (employee.salaryHistory || [])
      .filter(h => h && periodIndex(h.effectivePeriod || period) <= periodIndex(period))
      .sort((a,b) => periodIndex(a.effectivePeriod) - periodIndex(b.effectivePeriod));
    const latest = history[history.length - 1];
    return {
      salary: Number(latest?.salary ?? employee.salary) || 0,
      allowance: Number(latest?.allowance ?? employee.allowance) || 0
    };
  }

  function inputsForPeriod(employee, period) {
    const p = (employee.periodInputs || {})[period] || {};
    return {
      overtime: Number(p.overtime ?? employee.overtime) || 0,
      attendanceOvertime: Number(p.attendanceOvertime) || 0,
      bonus: Number(p.bonus ?? employee.bonus) || 0,
      commission: Number(p.commission ?? employee.commission) || 0,
      arrears: Number(p.arrears ?? employee.arrears) || 0,
      retroArrears: window.DalasiControls?.retroForPeriod ? window.DalasiControls.retroForPeriod(employee, period) : 0,
      absenceDeduction: Number(p.absenceDeduction ?? employee.absenceDeduction) || 0,
      customDeduction: Number(p.customDeduction ?? employee.customDeduction) || 0
    };
  }

  function obligationDeduction(employee, type, period) {
    const current = periodIndex(period);
    return round2((employee.obligations || [])
      .filter(o => o && o.type === type && o.status !== 'Closed' && periodIndex(o.startPeriod || period) <= current && (Number(o.outstanding)||0) > 0)
      .reduce((sum,o) => sum + Math.min(Number(o.monthlyRepayment)||0, Number(o.outstanding)||0), 0));
  }

  function calculateEmployee(employee, rules = DEFAULT_RULES, period = '2026-10') {
    const comp = compensationForPeriod(employee, period);
    const inputs = inputsForPeriod(employee, period);
    const basic = comp.salary;
    const allowance = comp.allowance;
    const recurring = window.DalasiOps?.recurringSummary ? window.DalasiOps.recurringSummary(employee, period) : {earnings:0,deductions:0,benefits:0,items:[]};
    const recurringEarnings = round2(recurring.earnings || 0);
    const recurringDeductions = round2(recurring.deductions || 0);
    const employerBenefits = round2(recurring.benefits || 0);
    const overtime = round2(inputs.overtime + inputs.attendanceOvertime);
    const bonus = inputs.bonus;
    const commission = inputs.commission;
    const retroArrears = round2(inputs.retroArrears || 0);
    const arrears = round2(inputs.arrears + retroArrears);
    const gross = round2(basic + allowance + recurringEarnings + overtime + bonus + commission + arrears);
    const taxable = gross;
    const paye = monthlyPAYE(taxable, rules.payeBands);

    let employeeContribution = 0;
    let employerContribution = 0;
    if (rules.scheme === 'FPS') {
      employeeContribution = 0;
      employerContribution = round2(gross * Number(rules.fpsEmployerRate || 0));
    } else {
      employeeContribution = round2(basic * Number(rules.npfEmployeeRate || 0));
      employerContribution = round2(basic * Number(rules.npfEmployerRate || 0));
    }

    const iicf = Math.min(round2(gross * Number(rules.iicfRate || 0)), Number(rules.iicfMonthlyCap || 0));
    const loanDeduction = round2((Number(employee.loan)||0) + obligationDeduction(employee,'Loan',period));
    const advanceDeduction = round2((Number(employee.advance)||0) + obligationDeduction(employee,'Advance',period));
    const absenceDeduction = round2(inputs.absenceDeduction);
    const customDeduction = round2(inputs.customDeduction);
    const otherDeductions = round2(loanDeduction + advanceDeduction + absenceDeduction + customDeduction + recurringDeductions);
    const totalDeductions = round2(paye + employeeContribution + otherDeductions);
    const net = round2(Math.max(0, gross - totalDeductions));
    const employerCost = round2(gross + employerContribution + iicf + employerBenefits);

    return {
      basic, allowance, recurringEarnings, employerBenefits, overtime, bonus, commission, arrears, retroArrears, gross, taxable, paye,
      employeeContribution, employerContribution, iicf, loanDeduction, advanceDeduction,
      absenceDeduction, customDeduction, recurringDeductions, otherDeductions, totalDeductions, net, employerCost
    };
  }

  function calculatePayroll(employees, rules = DEFAULT_RULES, period = '2026-10') {
    const rows = (employees || []).map(employee => ({employee, ...calculateEmployee(employee, rules, period)}));
    const keys = ['basic','allowance','recurringEarnings','employerBenefits','overtime','bonus','commission','arrears','retroArrears','gross','taxable','paye','employeeContribution','employerContribution','iicf','loanDeduction','advanceDeduction','absenceDeduction','customDeduction','recurringDeductions','otherDeductions','totalDeductions','net','employerCost'];
    const totals = Object.fromEntries(keys.map(k=>[k,0]));
    rows.forEach(r => keys.forEach(k => totals[k] += Number(r[k]) || 0));
    Object.keys(totals).forEach(k => totals[k] = round2(totals[k]));
    return { rows, totals };
  }

  function departmentSummary(rows) {
    const map = new Map();
    for (const r of rows) {
      const key = r.employee.department || 'Other';
      if (!map.has(key)) map.set(key, {department:key, employees:0, gross:0, net:0, employerCost:0});
      const d = map.get(key); d.employees++; d.gross += r.gross; d.net += r.net; d.employerCost += r.employerCost;
    }
    return [...map.values()].map(d => ({...d,gross:round2(d.gross),net:round2(d.net),employerCost:round2(d.employerCost)})).sort((a,b)=>b.gross-a.gross);
  }

  function estimateAbsenceDeduction(employee, days, rules = DEFAULT_RULES, period = '2026-10') {
    const comp = compensationForPeriod(employee, period);
    const divisor = Math.max(1, Number(rules.payrollDaysPerMonth) || 30);
    return round2((comp.salary / divisor) * Math.max(0, Number(days) || 0));
  }

  window.DalasiPayroll = {
    DEFAULT_RULES, annualPAYE, monthlyPAYE, calculateEmployee, calculatePayroll, departmentSummary,
    obligationDeduction, periodIndex, compensationForPeriod, inputsForPeriod, estimateAbsenceDeduction, round2
  };
})();

<script>
(() => {
  const round2=n=>Math.round((Number(n||0)+Number.EPSILON)*100)/100;
  const pct=(current,previous)=>previous?round2((Number(current||0)-Number(previous||0))/Math.abs(Number(previous))*100):(current?100:0);

  function applyBulkAdjustment(employees, period, adjustment={}){
    const ids=new Set(adjustment.employeeIds||[]), dept=adjustment.department||'All';
    const field=adjustment.field||'bonus', amount=Number(adjustment.amount)||0, mode=adjustment.mode||'add';
    const allowed=new Set(['overtime','bonus','commission','arrears','customDeduction']);
    if(!allowed.has(field)) throw new Error('Unsupported bulk adjustment field');
    const changed=[];
    (employees||[]).forEach(e=>{
      if(e.status==='Exited') return;
      if(ids.size && !ids.has(e.id)) return;
      if(!ids.size && dept!=='All' && e.department!==dept) return;
      e.periodInputs=e.periodInputs||{};
      const input=e.periodInputs[period]=Object.assign({overtime:0,attendanceOvertime:0,bonus:0,commission:0,arrears:0,absenceDeduction:0,customDeduction:0},e.periodInputs[period]||{});
      const before=Number(input[field])||0;
      input[field]=round2(mode==='replace'?amount:before+amount);
      changed.push({employeeId:e.id,before,after:input[field],field});
    });
    return {field,amount:round2(amount),mode,changed,count:changed.length};
  }

  function varianceDrilldown(currentPayroll, previousRun, threshold=10){
    if(!previousRun?.rows?.length) return [];
    const previous=new Map((previousRun?.rows||[]).map(r=>[r.employee?.id,r]));
    return (currentPayroll?.rows||[]).map(r=>{
      const p=previous.get(r.employee?.id), prevGross=Number(p?.gross)||0, currentGross=Number(r.gross)||0;
      const delta=round2(currentGross-prevGross), percent=p?pct(currentGross,prevGross):100;
      return {employeeId:r.employee?.id,employeeName:r.employee?.name,department:r.employee?.department,previousGross:round2(prevGross),currentGross:round2(currentGross),delta,pct:percent,newEmployee:!p,flag:!p||Math.abs(percent)>=Number(threshold||10)};
    }).sort((a,b)=>Math.abs(b.pct)-Math.abs(a.pct));
  }

  function exceptionCandidates({payroll, statutory, varianceRows=[], employees=[]}={}){
    const out=[];
    (statutory?.errors||[]).forEach((x,i)=>out.push({id:`stat-${x.type}-${x.employeeId||i}-${String(x.message).replace(/\W+/g,'-').toLowerCase()}`,type:'Statutory',severity:'Blocking',employeeId:x.employeeId||'',title:`${x.type} validation`,detail:x.message,source:'Statutory validation'}));
    (statutory?.warnings||[]).forEach((x,i)=>out.push({id:`warn-${x.type}-${x.employeeId||i}-${String(x.message).replace(/\W+/g,'-').toLowerCase()}`,type:x.type||'Warning',severity:'Review',employeeId:x.employeeId||'',title:`${x.type||'Payroll'} warning`,detail:x.message,source:'Payroll validation'}));
    varianceRows.filter(x=>x.flag).forEach(x=>out.push({id:`variance-${x.employeeId}`,type:'Variance',severity:'Review',employeeId:x.employeeId,title:'Material gross-pay variance',detail:`${x.pct>=0?'+':''}${x.pct}% (${round2(x.delta)}) versus previous archived payroll`,source:'Variance review'}));
    (payroll?.rows||[]).filter(r=>r.net!=null&&Number(r.net)<=0).forEach(r=>out.push({id:`net-${r.employee.id}`,type:'Payroll',severity:'Blocking',employeeId:r.employee.id,title:'Non-positive net pay',detail:`Net pay is ${round2(r.net)}`,source:'Payroll calculation'}));
    return out;
  }

  function mergeExceptionLedger(candidates, ledger=[], period){
    const map=new Map((ledger||[]).map(x=>[`${x.period}:${x.id}`,x]));
    return (candidates||[]).map(c=>{
      const prev=map.get(`${period}:${c.id}`)||{};
      return {...c,period,status:prev.status||'Open',note:prev.note||'',updatedAt:prev.updatedAt||null,updatedBy:prev.updatedBy||null};
    });
  }

  function closeChecklist({status,batchReconciliation,journal,statutory,exceptions=[],payslipStatuses={}}={}){
    const unresolvedReview=exceptions.filter(x=>x.severity==='Review'&&!['Resolved','Reviewed'].includes(x.status));
    const blocking=exceptions.filter(x=>x.severity==='Blocking');
    const issued=Object.values(payslipStatuses||{}).filter(x=>x?.status==='Issued').length;
    const items=[
      {id:'paid',label:'Payroll marked paid',pass:status==='Paid'||status==='Closed',detail:status==='Paid'||status==='Closed'?'Payment status completed':'Payroll must be Paid before close'},
      {id:'batch',label:'Payment batch reconciled',pass:!!batchReconciliation?.matched,detail:batchReconciliation?.matched?'Payment batch matches net payroll':'Prepare and reconcile payment batch'},
      {id:'journal',label:'Accounting journal balanced',pass:!!journal?.balanced,detail:journal?.balanced?'Debits equal credits':`Journal difference ${round2(journal?.difference||0)}`},
      {id:'statutory',label:'Statutory validation clean',pass:!!statutory?.ready,detail:statutory?.ready?'PAYE/SSHFC/IICF checks passed':`${statutory?.errors?.length||0} blocking statutory issue(s)`},
      {id:'exceptions',label:'Payroll exceptions reviewed',pass:blocking.length===0&&unresolvedReview.length===0,detail:blocking.length?`${blocking.length} blocking exception(s) remain`:unresolvedReview.length?`${unresolvedReview.length} review exception(s) remain`:'All payroll exceptions reviewed'},
      {id:'payslips',label:'Payslip issue status recorded',pass:true,detail:`${issued} payslip(s) marked issued; delivery does not block accounting close`}
    ];
    return {items,ready:items.filter(x=>x.id!=='payslips').every(x=>x.pass),passed:items.filter(x=>x.pass).length,total:items.length,blocking,unresolvedReview};
  }

  function createCloseRecord({period,run,status,checklist,closedBy}={}){
    if(!checklist?.ready) throw new Error('Payroll close checklist is not complete');
    return {id:`close-${period}`,period,runId:run?.id||'',status:'Closed',closedAt:new Date().toISOString(),closedBy:closedBy||'User',totals:run?.totals||{},employeeCount:run?.employeeCount||run?.rows?.length||0,checklist:checklist.items.map(x=>({id:x.id,label:x.label,pass:x.pass,detail:x.detail}))};
  }

  function salaryLetter({employee,company,period,effectiveDate,reason='Salary confirmation',brandNote=''}={}){
    const salary=Number(employee?.salary)||0, allowance=Number(employee?.allowance)||0;
    return {employeeId:employee?.id||'',employeeName:employee?.name||'',company:company||'',period,effectiveDate:effectiveDate||new Date().toISOString().slice(0,10),reason,basicSalary:round2(salary),fixedAllowance:round2(allowance),monthlyFixedCash:round2(salary+allowance),brandNote};
  }

  function detailedJournalRows(journal){
    return (journal?.entries||[]).map((x,i)=>({line:i+1,account:x.account,debit:round2(x.debit),credit:round2(x.credit),memo:x.memo}));
  }

  function statutoryPack({period,company,payroll,statutory,rules}={}){
    const generatedAt=new Date().toISOString();
    return {period,company,generatedAt,scheme:rules?.scheme||'',valid:!!statutory?.ready,validation:{errors:statutory?.errors||[],warnings:statutory?.warnings||[]},summary:{employees:payroll?.rows?.length||0,gross:round2(payroll?.totals?.gross),paye:round2(payroll?.totals?.paye),employeeContribution:round2(payroll?.totals?.employeeContribution),employerContribution:round2(payroll?.totals?.employerContribution),iicf:round2(payroll?.totals?.iicf),net:round2(payroll?.totals?.net)}};
  }

  window.DalasiAdmin={round2,applyBulkAdjustment,varianceDrilldown,exceptionCandidates,mergeExceptionLedger,closeChecklist,createCloseRecord,salaryLetter,detailedJournalRows,statutoryPack};
})();

<script>
(() => {
  const round2=n=>Math.round((Number(n||0)+Number.EPSILON)*100)/100;
  const INPUT_FIELDS=['overtime','bonus','commission','arrears','customDeduction'];

  function normalizeConfig(value={}){
    return {
      makerCheckerMode:['off','warn','enforce'].includes(value.makerCheckerMode)?value.makerCheckerMode:'warn',
      evidenceRetentionMonths:Math.max(12,Number(value.evidenceRetentionMonths)||84),
      taskLeadDays:Math.max(0,Number(value.taskLeadDays)||5)
    };
  }

  function periodInput(employee,period){
    const base={overtime:0,attendanceOvertime:0,bonus:0,commission:0,arrears:0,absenceDeduction:0,customDeduction:0};
    return Object.assign(base,employee?.periodInputs?.[period]||{});
  }

  function applyGridInputs(employees,period,rows=[]){
    const map=new Map((rows||[]).map(r=>[String(r.employeeId),r]));
    const changes=[];
    (employees||[]).forEach(e=>{
      const update=map.get(String(e.id)); if(!update||e.status==='Exited')return;
      e.periodInputs=e.periodInputs||{};
      const input=e.periodInputs[period]=periodInput(e,period);
      INPUT_FIELDS.forEach(field=>{
        if(update[field]===undefined)return;
        const before=Number(input[field])||0, after=round2(Math.max(0,Number(update[field])||0));
        if(before!==after){input[field]=after;changes.push({employeeId:e.id,field,before,after});}

<script>
(() => {
  const DEFAULT_HR_CONFIG = {
    varianceThreshold: 10,
    departments: [
      {id:'operations',name:'Operations',code:'OPS'},
      {id:'finance',name:'Finance',code:'FIN'},
      {id:'people',name:'People',code:'PPL'},
      {id:'technology',name:'Technology',code:'TECH'},
      {id:'sales',name:'Sales',code:'SAL'}
    ],
    jobGrades: [
      {id:'G1',name:'Support',min:0,max:9999,defaultAllowance:700},
      {id:'G2',name:'Officer',min:10000,max:13999,defaultAllowance:1200},
      {id:'G3',name:'Specialist',min:14000,max:17999,defaultAllowance:1800},
      {id:'G4',name:'Senior / Manager',min:18000,max:22999,defaultAllowance:2400},
      {id:'G5',name:'Leadership',min:23000,max:null,defaultAllowance:3000}
    ],
    delegations: []
  };
  const round2 = n => Math.round((Number(n||0)+Number.EPSILON)*100)/100;
  const clone = v => JSON.parse(JSON.stringify(v));
  const periodIndex = period => {const [y,m]=String(period||'2026-10').split('-').map(Number);return (y||0)*12+(m||1)-1;};
  function normalizeConfig(config={}){
    return {
      varianceThreshold: Math.max(1,Number(config.varianceThreshold)||DEFAULT_HR_CONFIG.varianceThreshold),
      departments: Array.isArray(config.departments)&&config.departments.length?config.departments:clone(DEFAULT_HR_CONFIG.departments),
      jobGrades: Array.isArray(config.jobGrades)&&config.jobGrades.length?config.jobGrades:clone(DEFAULT_HR_CONFIG.jobGrades),
      delegations: Array.isArray(config.delegations)?config.delegations:[]
    };
  }
  function gradeForSalary(salary, config=DEFAULT_HR_CONFIG){
    const grades=normalizeConfig(config).jobGrades,n=Number(salary)||0;
    return grades.find(g=>n>=Number(g.min||0)&&(g.max==null||n<=Number(g.max)))||grades[grades.length-1]||null;
  }
  function gradeById(id, config=DEFAULT_HR_CONFIG){return normalizeConfig(config).jobGrades.find(g=>g.id===id)||null;}
  function salaryBandStatus(employee, config=DEFAULT_HR_CONFIG){
    const grade=gradeById(employee.jobGrade,config)||gradeForSalary(employee.salary,config); if(!grade)return {ok:true,grade:null};
    const salary=Number(employee.salary)||0,ok=salary>=Number(grade.min||0)&&(grade.max==null||salary<=Number(grade.max));
    return {ok,grade,below:salary<Number(grade.min||0),above:grade.max!=null&&salary>Number(grade.max)};
  }
  function onboardingTemplate(){return [
    {id:'record',label:'Employee record completed',done:false},
    {id:'statutory',label:'TIN and SSHFC recorded',done:false},
    {id:'payment',label:'Payment details confirmed',done:false},
    {id:'contract',label:'Contract / appointment document filed',done:false},
    {id:'portal',label:'Self-service access prepared',done:false}
  ];}
  function offboardingTemplate(){return [
    {id:'finalpay',label:'Final payroll reviewed',done:false},
    {id:'assets',label:'Company assets returned',done:false},
    {id:'handover',label:'Work handover completed',done:false},
    {id:'documents',label:'Exit documents prepared',done:false},
    {id:'portal',label:'Employee portal access disabled',done:false}
  ];}
  function ensureEmployeeProfile(employee, config=DEFAULT_HR_CONFIG){
    const e=employee, inferred=gradeForSalary(e.salary,config);
    e.jobGrade=e.jobGrade||inferred?.id||'';
    e.employmentType=e.employmentType||'Permanent';
    e.contract=Object.assign({type:e.employmentType,startDate:e.startDate||'',endDate:'',status:'Active'},e.contract||{});
    e.onboarding=e.onboarding||{status:'In progress',startedAt:new Date().toISOString(),completedAt:null,checklist:onboardingTemplate()};
    if(!Array.isArray(e.onboarding.checklist))e.onboarding.checklist=onboardingTemplate();
    const auto={record:!!e.name,statutory:!!e.tin&&!!e.sshfc,payment:!!e.bank&&e.bank!=='Not added',contract:!!e.contract?.type||(e.documents||[]).some(d=>d.category==='Contract'),portal:e.portalEnabled!==false};
    e.onboarding.checklist=e.onboarding.checklist.map(x=>({...x,done:x.done||!!auto[x.id]}));
    if(e.onboarding.checklist.every(x=>x.done)){e.onboarding.status='Complete';e.onboarding.completedAt=e.onboarding.completedAt||new Date().toISOString();}
    e.offboarding=e.offboarding||{status:'Not started',lastDay:'',reason:'',startedAt:null,completedAt:null,checklist:offboardingTemplate()};
    if(!Array.isArray(e.offboarding.checklist))e.offboarding.checklist=offboardingTemplate();

  }
  function workflowProgress(workflow){const list=workflow?.checklist||[];const done=list.filter(x=>x.done).length;return {done,total:list.length,pct:list.length?Math.round(done/list.length*100):0,complete:list.length>0&&done===list.length};}
  function expiryDate(value){const t=new Date(value||'').getTime();return Number.isFinite(t)?t:null;}
  function expiringItems(employees, days=60, now=new Date()){
    const start=now.getTime(),end=start+Number(days)*86400000,out=[];
    (employees||[]).forEach(e=>{
      const contractEnd=expiryDate(e.contract?.endDate);
      if(contractEnd&&contractEnd>=start&&contractEnd<=end)out.push({type:'Contract',employee:e,name:`${e.contract?.type||'Contract'} contract`,expiryDate:e.contract.endDate,days:Math.ceil((contractEnd-start)/86400000)});
      (e.documents||[]).forEach(d=>{const t=expiryDate(d.expiryDate);if(t&&t>=start&&t<=end)out.push({type:'Document',employee:e,name:d.name,category:d.category||'Document',expiryDate:d.expiryDate,days:Math.ceil((t-start)/86400000),document:d});});
    });
    return out.sort((a,b)=>a.days-b.days);
  }
  function previousRun(runs,currentPeriod){return (runs||[]).filter(r=>Array.isArray(r.rows)&&['Approved','Paid'].includes(r.status)&&periodIndex(r.period)<periodIndex(currentPeriod)).sort((a,b)=>periodIndex(b.period)-periodIndex(a.period))[0]||null;}
  function variance(currentPayroll, previous, threshold=10){
    if(!previous?.totals)return {hasBaseline:false,threshold:Number(threshold)||10,metrics:[],employeeFlags:[]};
    const cur=currentPayroll?.totals||{},prev=previous.totals||{},metric=(key,label)=>{const a=Number(cur[key])||0,b=Number(prev[key])||0,pct=b?round2((a-b)/b*100):(a?100:0);return {key,label,current:a,previous:b,change:round2(a-b),pct,flag:Math.abs(pct)>=Number(threshold||10)}};
    const prevMap=new Map((previous.rows||[]).map(r=>[r.employee?.id,r]));
    const employeeFlags=(currentPayroll?.rows||[]).map(r=>{const old=prevMap.get(r.employee?.id);if(!old)return {employee:r.employee,type:'New employee',current:r.gross,previous:0,pct:100};const b=Number(old.gross)||0,pct=b?round2((Number(r.gross)-b)/b*100):0;return Math.abs(pct)>=Number(threshold||10)?{employee:r.employee,type:'Gross pay variance',current:r.gross,previous:b,pct}:null;}).filter(Boolean);
    return {hasBaseline:true,baselinePeriod:previous.period,threshold:Number(threshold)||10,metrics:[metric('gross','Gross payroll'),metric('net','Net payroll'),metric('paye','PAYE'),metric('employerCost','Employer cost')],employeeFlags};
  }
  function delegationApplies(delegation,{step,userId,period}){
    if(!delegation||delegation.active===false||delegation.step!==step||delegation.delegateUserId!==userId)return false;
    if(delegation.startPeriod&&periodIndex(period)<periodIndex(delegation.startPeriod))return false;
    if(delegation.endPeriod&&periodIndex(period)>periodIndex(delegation.endPeriod))return false;
    return true;
  }
  window.DalasiHR={DEFAULT_HR_CONFIG,normalizeConfig,gradeForSalary,gradeById,salaryBandStatus,onboardingTemplate,offboardingTemplate,ensureEmployeeProfile,workflowProgress,expiringItems,previousRun,variance,delegationApplies,periodIndex};
})();

  function processBrandLogoFile(file){
    return new Promise((resolve,reject)=>{
      if(!file){resolve(null);return}
      if(!/^image\/(png|jpeg|webp)$/i.test(file.type||'')){reject(new Error('Use a PNG, JPG or WebP logo.'));return}
      if(file.size>3000000){reject(new Error('Logo file must be smaller than 3 MB.'));return}
      const reader=new FileReader();
      reader.onerror=()=>reject(new Error('Unable to read the logo file.'));
      reader.onload=()=>{
        const img=new Image();
        img.onerror=()=>reject(new Error('Unable to open that logo image.'));
        img.onload=()=>{
          const size=256,margin=20,canvas=document.createElement('canvas');
          canvas.width=size;canvas.height=size;
          const ctx=canvas.getContext('2d');
          ctx.fillStyle='#ffffff';ctx.fillRect(0,0,size,size);
          const scale=Math.min((size-margin*2)/img.width,(size-margin*2)/img.height);
          const w=Math.max(1,img.width*scale),h=Math.max(1,img.height*scale),x=(size-w)/2,y=(size-h)/2;
          ctx.drawImage(img,x,y,w,h);
          resolve(canvas.toDataURL('image/jpeg',0.9));
        };
        img.src=String(reader.result||'');
      };
      reader.readAsDataURL(file);
    });
  }

  function payrollBody(step,p,missing){const t=p.totals;
    if(step===0)return `<div class="big-row"><strong>${p.rows.length}</strong><span>employees included</span>${pill(`${missing.length} need SSHFC review`,missing.length?'neutral':'ready')}</div><div class="mini-list">${p.rows.slice(0,6).map(r=>`<div>${person(r.employee)}<span>${r.employee.department}</span><b>${money2(r.gross)}</b>${pill('Included','ready')}</div>`).join('')}</div>`;
    if(step===1)return `${amount('Basic salaries',money2(t.basic))}${amount('Fixed allowances',money2(t.allowance))}${amount('Recurring taxable earnings',money2(t.recurringEarnings||0),'Company-configured recurring items')}${amount('Overtime',money2(t.overtime))}${amount('Bonuses & commission',money2(t.bonus+t.commission))}${amount('Manual arrears / back pay',money2((t.arrears||0)-(t.retroArrears||0)))}${amount('Retroactive salary adjustments',money2(t.retroArrears||0),'Generated from effective-dated salary changes')}${amount('Gross payroll',money2(t.gross),'',true)}<div class="input-section"><div class="input-section-head"><div><b>Monthly earnings inputs</b><p>Overtime, bonuses, commission and arrears apply only to ${periodLabel(state.currentPeriod)}.</p></div>${pill(state.payrollStatus,state.payrollStatus.toLowerCase())}</div><div class="mini-input-table">${p.rows.slice(0,8).map(r=>{const x=periodInputs(r.employee),extras=(x.overtime||0)+(x.bonus||0)+(x.commission||0)+(x.arrears||0);return `<div><span>${r.employee.initials}</span><div><b>${esc(r.employee.name)}</b><small>${extras?`Additional earnings ${money2(extras)}`:'No additional earnings'}</small></div><button class="secondary" data-action="inputs:${r.employee.id}" ${['Approved','Paid','Closed'].includes(state.payrollStatus)?'disabled':''}>Edit inputs</button></div>`}).join('')}</div></div><div class="calc-note">Monthly payroll inputs are stored by period, so overtime or bonuses in one month do not leak into another.</div>`;

  function notificationSummary(){
    const p=payrollCalc(),m=missingSshfc(),leaves=pendingLeaveRequests(),flow=approvalForPeriod(),expiring=expiryItems(60),onboarding=onboardingQueue();
    const ar=window.DalasiBusinessPayments?.receivableSummary?.(state)||{overdue:0};
    const today=new Date().toISOString().slice(0,10),openBills=(state.businessBills||[]).filter(x=>x.status!=='Paid'),overdueBills=openBills.filter(x=>x.dueDate&&x.dueDate<today),lowStock=window.DalasiInventory?.reorderRows?.(state)||[],pendingPO=(state.purchaseOrders||[]).filter(x=>x.status==='Pending approval');
    const items=[];
    if(ar.overdue>0)items.push({level:'warn',page:'credit',icon:'reports',title:'Overdue customer balances',copy:money2(ar.overdue)+' requires collection follow-up.'});
    if(overdueBills.length)items.push({level:'warn',page:'payments',icon:'file',title:overdueBills.length+' overdue supplier bill'+(overdueBills.length===1?'':'s'),copy:'Review upcoming and past-due supplier obligations.'});
    if(lowStock.length)items.push({level:lowStock.some(x=>x.severity==='Out of stock')?'warn':'amber',page:'inventory',icon:'box',title:lowStock.length+' product'+(lowStock.length===1?'':'s')+' need replenishment',copy:'Open inventory reorder recommendations.'});
    if(pendingPO.length)items.push({level:'amber',page:'expenses',icon:'building',title:pendingPO.length+' purchase order'+(pendingPO.length===1?'':'s')+' awaiting approval',copy:'Review procurement requests before ordering.'});
    if(m.length)items.push({level:'warn',page:'employees',icon:'alert',title:m.length+' employee record'+(m.length===1?'':'s')+' incomplete',copy:'SSHFC numbers are missing.'});
    if(onboarding.length)items.push({level:'amber',page:'employees',icon:'employees',title:onboarding.length+' onboarding workflow'+(onboarding.length===1?'':'s')+' open',copy:'Complete employee setup checklists.'});
    if(expiring.length)items.push({level:'amber',page:'employees',icon:'file',title:expiring.length+' contract/document expiry alert'+(expiring.length===1?'':'s'),copy:esc(expiring[0].employee.name)+' · '+esc(expiring[0].name)+' · '+expiring[0].days+' days.'});
    if(state.notificationPrefs.leave&&leaves.length)items.push({level:'amber',action:'open-leave-review',icon:'calendar',title:leaves.length+' leave request'+(leaves.length===1?'':'s')+' waiting',copy:'Review employee self-service requests.'});
    if(state.notificationPrefs.payroll&&!approvalReady()&&state.payrollStep>=3)items.push({level:'amber',page:'payroll',icon:'clock',title:'Payroll approvals incomplete',copy:flow.filter(x=>x.status!=='Approved').map(x=>x.label).join(' and ')+' still pending.'});
    const keyed=items.map(x=>{const raw=[x.title,x.copy,x.page||'',x.action||''].join('|');let h=2166136261;for(let i=0;i<raw.length;i++){h^=raw.charCodeAt(i);h=Math.imul(h,16777619)}return {...x,id:'n'+(h>>>0).toString(36)}});
    const unread=keyed.filter(x=>!(state.notificationRead||{})[x.id]);
    return {items:keyed,unread,urgent:unread.filter(x=>x.level==='warn').length};
  }

  async function handleAuth(ev){
    ev.preventDefault(); state.authError='';state.authNotice=''; const fd=new FormData(ev.target);
    try{
      if(state.authView==='forgot'){
        const email=String(fd.get('email')||'').trim().toLowerCase();state.authPendingEmail=email;
        await window.DalasiAuth.requestPasswordReset(email);state.authNotice=`Recovery email sent to ${email}. Open the link on this device to choose a new password.`;render();return;
      }
      if(state.authView==='recovery'){
        const password=String(fd.get('password')||''),confirm=String(fd.get('confirmPassword')||'');if(password!==confirm)throw new Error('The two passwords do not match.');
        await window.DalasiAuth.updatePassword(password);state.authView='signin';state.authNotice='Password updated. Sign in with your new password.';history.replaceState({},'',location.pathname);render();return;
      }
      const email=String(fd.get('email')||'').trim().toLowerCase();state.authPendingEmail=email;
      const result=state.authView==='signup'?await window.DalasiAuth.signUp({name:fd.get('name'),email,password:fd.get('password')}):await window.DalasiAuth.signIn({email,password:fd.get('password')});
      if(result?.needsEmailConfirmation){state.authView='signin';state.authNotice=`Account created for ${result.email}. Check your email to confirm it, then sign in.`;state.session=null;render();return}
      state.session=result;loadOrgState();render();
    }
    catch(err){state.authError=err?.message||'Unable to complete authentication.';render();}
  }

    else if(a.startsWith('approve-workflow:')){const id=a.split(':')[1];if(!canApproveWorkflow(id)){toast(`${id==='hr'?'HR':'Finance'} approval permission or an active delegation is required.`);return}state.approvalCommentStep=id;render()}
    else if(a.startsWith('leave:')){if(!requirePermission('employees.manage','HR access is required to manage employee leave.'))return;state.leaveEmployee=byId(a.split(':')[1]);state.selectedEmployee=null;render()}
    else if(a.startsWith('documents:')){if(!(can('documents.manage')||can('documents.view'))){toast('Your role cannot access employee documents.');return}state.documentEmployee=byId(a.split(':')[1]);state.selectedEmployee=null;render()}
    else if(a.startsWith('advance:')){if(!requirePermission('payroll.manage','Payroll Admin or Owner access is required for salary advances.'))return;state.debtDefaultType='Advance';state.debtEmployee=byId(a.split(':')[1]);state.selectedEmployee=null;render()}
    else if(a.startsWith('debt:')){if(!requirePermission('payroll.manage','Payroll Admin or Owner access is required for staff loans.'))return;state.debtDefaultType='Loan';state.debtEmployee=byId(a.split(':')[1]);state.selectedEmployee=null;render()}

    else if(a.startsWith('remove-recurring:')){if(!requirePermission('payroll.manage'))return;const [,eid,rid]=a.split(':');const emp=byId(eid);if(emp){emp.recurringItems=(emp.recurringItems||[]).filter(x=>x.id!==rid);audit('employee.recurring_item_removed',{employeeId:eid,itemId:rid});save();toast('Recurring item removed');render()}}
    else if(a.startsWith('settlement:')){if(!requirePermission('payroll.manage','Payroll Admin or Owner access is required for final settlement previews.'))return;state.settlementEmployee=byId(a.split(':')[1]);state.offboardingEmployee=null;state.selectedEmployee=null;render()}
    else if(a.startsWith('correct-run:')){if(!requirePermission('payroll.manage'))return;state.correctionRun=state.runs.find(r=>r.id===a.split(':')[1])||null;state.selectedRun=null;render()}

    else if(a==='save-settings'){if(!(can('workspace.manage')||can('payroll.manage'))){toast('Your role cannot change workspace settings.');return}const newName=(state.settingsCompany||state.company).trim();if(newName&&newName!==state.company){state.org=await window.DalasiAuth.updateOrganization(state.org.id,{name:newName});state.company=newName;state.organizations=window.DalasiAuth.listOrganizations()}if(state.settingsScheme)state.rules.scheme=state.settingsScheme;state.rules.overtimeMultiplier=Math.max(1,Number(document.getElementById('overtime-multiplier')?.value)||1.5);state.hrConfig.varianceThreshold=Math.max(1,Number(document.getElementById('variance-threshold')?.value)||10);state.branding.accent=document.getElementById('brand-accent')?.value||state.branding.accent;state.branding.logoText=String(document.getElementById('brand-logo-text')?.value||state.branding.logoText||'D').slice(0,3).toUpperCase();state.branding.payslipNote=String(document.getElementById('brand-note')?.value||state.branding.payslipNote||'Payroll, beautifully handled.');state.notificationPrefs={leave:!!document.getElementById('pref-leave')?.checked,payroll:!!document.getElementById('pref-payroll')?.checked,payslips:!!document.getElementById('pref-payslips')?.checked};state.opsConfig.paydayDay=Math.min(31,Math.max(1,Number(document.getElementById('ops-payday')?.value)||28));state.opsConfig.payrollPrepLeadDays=Math.min(15,Math.max(0,Number(document.getElementById('ops-prep-days')?.value)||5));state.opsConfig.bankFileFormat=String(document.getElementById('ops-bank-format')?.value||'Generic CSV');state.opsConfig.paymentReferencePrefix=String(document.getElementById('ops-ref-prefix')?.value||'SAL').replace(/[^A-Za-z0-9]/g,'').slice(0,8).toUpperCase()||'SAL';state.v012Config.makerCheckerMode=String(document.getElementById('maker-checker-mode')?.value||state.v012Config.makerCheckerMode||'warn');state.v012Config.evidenceRetentionMonths=Math.max(12,Number(document.getElementById('evidence-retention')?.value)||84);state.settingsCompany=null;state.settingsScheme=null;audit('settings.updated',{scheme:state.rules.scheme,branding:true,notifications:true,payrollOperations:true});save();toast('Workspace settings, branding and notifications saved')}
    else if(a==='remove-brand-logo'){if(!requirePermission('workspace.manage','Only the workspace owner can change the company logo.'))return;state.branding.logoData='';save();toast('Company logo removed');render()}
    else if(a==='reset-settings'){state.settingsCompany=state.company;state.settingsScheme=state.rules.scheme;render()}
    else if(a==='demo-rule')toast('Verified defaults are protected in this preview. Editable statutory-rule versions will be enabled after a dedicated DalasiPay backend is connected')
    else if(a==='save-pdf'){downloadPayslipPdf(state.selectedPayslip)}
    else if(a.startsWith('download-payslip:')){const em=byId(a.split(':')[1]);if(em)downloadPayslipPdf(em)}
    else if(a==='print-current'){window.print()}
    else if(a.startsWith('preview:')){state.selectedPayslip=byId(a.split(':')[1]);render()}
    else if(a.startsWith('email:')){const em=byId(a.split(':')[1]);if(em)emailEmployee(em)}
    else if(a.startsWith('whatsapp:')){const em=byId(a.split(':')[1]);if(em)whatsappEmployee(em)}
    else if(a.startsWith('print:')){state.selectedPayslip=byId(a.split(':')[1]);render();setTimeout(()=>window.print(),180)}
  });
  document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();state.searchOpen=true;render()}if(e.key==='Escape'&&(state.searchOpen||state.selectedPayslip||state.selectedEmployee||state.addOpen||state.importOpen||state.paymentOpen||state.assetOpen||state.assetDisposeId||state.taxSettingsOpen||state.taxAdjustmentOpen||state.vatPaymentOpen||state.budgetLineOpen||state.loanOpen||state.loanRepayId||state.collectionCustomerId||state.reminderSettingsOpen||state.reminderPreviewId||state.creditLimitCustomerId||state.creditNoteInvoiceId||state.supplierCreditBillId||state.customerRefundCreditId||state.supplierRefundCreditId||state.statementRunOpen||state.customerDebitInvoiceId||state.supplierDebitBillId||state.beneficiaryOpen||state.billOpen||state.recurringOpen||state.receivableOpen||state.recurringInvoiceOpen||state.recurringInvoiceHistoryId||state.incomingPaymentOpen||state.customerOpen||state.customerAccountId||state.inputEmployee||state.leaveEmployee||state.documentEmployee||state.onboardingEmployee||state.offboardingEmployee||state.structureOpen||state.delegationOpen||state.movementEmployee||state.correctionRun||state.financeStructureOpen||state.spreadsheetOpen||state.massUpdateOpen||state.payrollNotesOpen||state.payrollTasksOpen||state.approvalCommentStep)){state.searchOpen=false;state.selectedPayslip=null;state.selectedEmployee=null;state.addOpen=false;state.importOpen=false;state.importRows=[];state.editEmployee=null;state.debtEmployee=null;state.inputEmployee=null;state.leaveEmployee=null;state.documentEmployee=null;state.onboardingEmployee=null;state.offboardingEmployee=null;state.structureOpen=null;state.delegationOpen=false;state.movementEmployee=null;state.correctionRun=null;state.financeStructureOpen=null;state.bulkAdjustmentOpen=false;state.varianceOpen=false;state.exceptionOpen=false;state.salaryLetterEmployee=null;state.closeOpen=false;state.spreadsheetOpen=false;state.massUpdateOpen=false;state.payrollNotesOpen=false;state.payrollTasksOpen=false;state.approvalCommentStep=null;state.recurringEmployee=null;state.settlementEmployee=null;state.paymentBatchOpen=false;state.attendanceEmployee=null;state.portalEmployee=null;state.leaveReviewOpen=false;state.periodOpen=false;state.paymentOpen=false;state.assetOpen=false;state.assetDisposeId=null;state.taxSettingsOpen=false;state.taxAdjustmentOpen=false;state.vatPaymentOpen=false;state.budgetLineOpen=false;state.budgetLineId=null;state.loanOpen=false;state.loanRepayId=null;state.collectionCustomerId=null;state.creditLimitCustomerId=null;state.creditNoteInvoiceId=null;state.supplierCreditBillId=null;state.customerRefundCreditId=null;state.supplierRefundCreditId=null;state.statementRunOpen=null;state.customerDebitInvoiceId=null;state.supplierDebitBillId=null;state.beneficiaryOpen=false;state.billOpen=false;state.recurringOpen=false;state.receivableOpen=false;state.recurringInvoiceOpen=false;state.recurringInvoiceHistoryId=null;state.incomingPaymentOpen=false;state.incomingPaymentInvoiceId=null;state.paymentBeneficiaryId=null;state.paymentBillId=null;state.selectedRun=null;render()}});
