      - name: Install isolated PostgreSQL test runtime
        run: npm ci --prefix tests/admin-auth-runtime --ignore-scripts --no-audit --no-fund
      - name: Verify first-administrator transaction and Worker flow against PostgreSQL
        env:
          PGLITE_MODULE: ${{ github.workspace }}/tests/admin-auth-runtime/node_modules/@electric-sql/pglite/dist/index.js
        run: node --test tests/admin-bootstrap.postgres.test.mjs tests/licensing-management.postgres.test.mjs tests/procurement-state.postgres.test.mjs
      - name: Check release guards
        run: node --test tests/cloudflare-release.test.mjs
      - name: Install locked deployment tooling without credentials
        run: npm ci --prefix tools/cloudflare --ignore-scripts --no-audit --no-fund
      - name: Dry-run all existing Worker configurations
        run: node scripts/cloudflare-release.mjs dry-run

  master-data-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install isolated browser test tooling
        run: |
          mkdir -p /tmp/dalasipay-browser-qa
          cd /tmp/dalasipay-browser-qa
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.56.1
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Install isolated PostgreSQL browser runtime
        run: npm ci --prefix tests/admin-auth-runtime --ignore-scripts --no-audit --no-fund
      - name: Run nonproduction master-data browser regressions
        env:
          PLAYWRIGHT_MODULE: /tmp/dalasipay-browser-qa/node_modules/playwright
          PGLITE_MODULE: ${{ github.workspace }}/tests/admin-auth-runtime/node_modules/@electric-sql/pglite/dist/index.js
        run: node --test tests/master-data-forms.browser.cjs tests/procurement-authenticated-local.browser.cjs
