name: Licensing safety checks

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'licensing-*.js'
      - 'licensing-*.mjs'
      - 'workspace-subscription*'
      - 'index.html'
      - 'cloudflare-main/**'
      - 'subscription-*.js'
      - 'subscription-*.mjs'
      - '.github/workflows/**'
      - 'scripts/**'
      - 'tools/cloudflare/**'
      - 'cloudflare-licensing-worker/**'
      - 'supabase-licensing-provider*'
      - 'verified-licensing-endpoint*'
      - 'platform-admin-session*'
      - 'cloudflare-admin-worker/**'
      - 'tests/admin-bootstrap.postgres.test.mjs'
      - 'tests/admin-auth-runtime/**'
      - 'tests/licensing-management.postgres.test.mjs'
      - 'supabase/migrations/**'
      - 'tests/platform-admin-lookup-proposal*'
  pull_request:
    paths:
      - 'licensing-*.js'
      - 'licensing-*.mjs'
      - 'workspace-subscription*'
      - 'index.html'
      - 'cloudflare-main/**'
      - 'subscription-*.js'
      - 'subscription-*.mjs'
      - '.github/workflows/**'
      - 'scripts/**'
      - 'tools/cloudflare/**'
      - 'cloudflare-licensing-worker/**'
      - 'supabase-licensing-provider*'
      - 'verified-licensing-endpoint*'
      - 'platform-admin-session*'
      - 'cloudflare-admin-worker/**'
      - 'tests/licensing-management.postgres.test.mjs'
      - 'supabase/migrations/**'

permissions:
  contents: read

jobs:
  licensing-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check syntax
        run: |
          node --check licensing-policy.js
          node --check workspace-subscription.js
          node --check subscription-plan-view.js
          node --check subscription-usage.js
          node --check subscription-verify.js
          node --check subscription-usage-panel.js
          node --check licensing-observer-core.mjs
          node --check licensing-usage-observer.mjs
          node --check licensing-app-state-usage.mjs
          node --check licensing-readiness.mjs
          node --check licensing-admin-contract.mjs
          node --check licensing-admin-authorization.mjs
          node --check licensing-platform-admin-policy.mjs
          node --check licensing-admin-review-plan.mjs
          node --check licensing-atomic-review-simulation.mjs
          node --check subscription-admin-preview.js
          node --check cloudflare-licensing-observer.mjs
          node --check licensing-http-adapter.mjs
          node --check supabase-licensing-provider.mjs
          node --check verified-licensing-endpoint.mjs
          node --check platform-admin-session.mjs
          node --check tests/platform-admin-lookup-proposal.test.mjs
          node --check cloudflare-admin-worker/index.mjs
          node --check cloudflare-admin-worker/dashboard-preview.mjs
          node --check cloudflare-admin-worker/protected-dashboard.mjs
          node --check cloudflare-admin-worker/access-jwt.mjs
          node --check cloudflare-admin-worker/access-bound-dashboard.mjs
          node --check cloudflare-admin-worker/operator-identity-map.mjs
          node --check cloudflare-admin-worker/restricted-admin-lookup.mjs
          node --check cloudflare-admin-worker/private-auth-entry.mjs
          node --check cloudflare-admin-worker/worker-paste-private.js
          node --check cloudflare-admin-worker/private-service-authorization.mjs
          node --check cloudflare-admin-worker/private-membership.mjs
          node --check cloudflare-admin-worker/membership-integration.mjs
          node --check cloudflare-licensing-worker/index.mjs
      - name: Run licensing unit and security tests
        run: |
          node --test \
            licensing-policy.test.js \
            workspace-subscription.test.js \
            subscription-plan-view.test.js \
            subscription-customer.test.js \
            subscription-usage.test.js \
            subscription-verify.test.js \
            subscription-usage-panel.test.js \
            cloudflare-licensing-observer.test.mjs \
            licensing-usage-observer.test.mjs \
            licensing-app-state-usage.test.mjs \
            licensing-readiness.test.mjs \
            licensing-admin-contract.test.mjs \
            licensing-admin-authorization.test.mjs \
            licensing-platform-admin-policy.test.mjs \
            licensing-admin-review-plan.test.mjs \
            licensing-atomic-review-simulation.test.mjs \
            subscription-admin-preview.test.js \
            licensing-http-adapter.test.mjs \
            licensing-startup-guard.test.js \
            supabase-licensing-provider.test.mjs \
            verified-licensing-endpoint.test.mjs \
            platform-admin-session.test.mjs \
            tests/annual-pricing.test.mjs \
            tests/platform-admin-lookup-proposal.test.mjs \
            cloudflare-admin-worker/index.test.mjs \
            cloudflare-admin-worker/dashboard-preview.test.mjs \
            cloudflare-admin-worker/protected-dashboard.test.mjs \
            cloudflare-admin-worker/access-jwt.test.mjs \
            cloudflare-admin-worker/access-bound-dashboard.test.mjs \
            cloudflare-admin-worker/operator-identity-map.test.mjs \
            cloudflare-admin-worker/restricted-admin-lookup.test.mjs \
            cloudflare-admin-worker/private-auth-entry.test.mjs \
            cloudflare-admin-worker/worker-paste-private.test.mjs \
            cloudflare-admin-worker/auth-flow.integration.test.mjs \
            cloudflare-admin-worker/bootstrap-identity.test.mjs \
            cloudflare-admin-worker/management-routes.test.mjs \
            cloudflare-admin-worker/private-service-authorization.test.mjs \
            cloudflare-admin-worker/private-membership.test.mjs \
            cloudflare-admin-worker/membership-integration.test.mjs \
            cloudflare-licensing-worker/customer-portal.test.mjs \
            cloudflare-licensing-worker/index.test.mjs

      - name: Install isolated PostgreSQL test runtime
        run: npm ci --prefix tests/admin-auth-runtime --ignore-scripts --no-audit --no-fund
      - name: Verify first-administrator transaction and Worker flow against PostgreSQL
        env:
          PGLITE_MODULE: ${{ github.workspace }}/tests/admin-auth-runtime/node_modules/@electric-sql/pglite/dist/index.js
        run: node --test tests/admin-bootstrap.postgres.test.mjs tests/licensing-management.postgres.test.mjs
      - name: Check release guards
        run: node --test tests/cloudflare-release.test.mjs
      - name: Install locked deployment tooling without credentials
        run: npm ci --prefix tools/cloudflare --ignore-scripts --no-audit --no-fund
      - name: Dry-run all existing Worker configurations
        run: node scripts/cloudflare-release.mjs dry-run
